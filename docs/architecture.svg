      <path d="M0 0L10 5L0 10z" fill="#7c3aed"/>
    </marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#9aa3b2"/>
