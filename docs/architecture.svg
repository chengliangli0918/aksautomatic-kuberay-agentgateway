<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>POC architecture: vLLM on AKS Automatic with KubeRay and agentgateway</title>
  <desc>Callers send HTTPS requests with an API key to a public Azure endpoint. agentgateway terminates TLS and rate-limits per IP, the quota proxy authenticates callers, picks a model for "auto" requests with a small CPU decision model, and enforces per-caller quotas, and Ray Serve serves gpt-oss-20b, gpt-oss-120b, and Qwen3.5-4B on one 8xA100 node.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7fb; }
      .grid { fill: url(#grid); }
      .card { fill: #ffffff; stroke: #e1e4ec; stroke-width: 1.2; }
      .h1 { font-size: 30px; font-weight: 700; fill: #111827; }
      .sub { font-size: 16px; fill: #4b5563; }
      .t { font-size: 15px; font-weight: 600; fill: #111827; }
      .d { font-size: 12.5px; fill: #4b5563; }
      .m { font-size: 11px; fill: #6b7280; }
      .cap { font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-size: 11.5px; letter-spacing: 1.5px; }
      .azure { fill: #f3f8fd; stroke: #0078d4; stroke-opacity: 0.35; stroke-width: 1.5; }
      .azure-cap { fill: #0b5cad; }
      .aks { fill: #eef3ff; stroke: #326ce5; stroke-opacity: 0.45; stroke-width: 1.5; }
      .aks-cap { fill: #1d4ed8; }
      .ns { fill: none; stroke: #b7bfd3; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .ns-cap { fill: #6b7280; }
      .ray { fill: #faf7ff; stroke: #a78bfa; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .ray-cap { fill: #6d28d9; }
      .req { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 8 6; }
      .ctl { fill: none; stroke: #9aa3b2; stroke-width: 1.6; stroke-dasharray: 2 5; stroke-linecap: round; }
      .ibox { fill: #f3efff; stroke: #e3daff; }
      .glyph { fill: none; stroke: #6d28d9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .badge { fill: #7c3aed; stroke: #ffffff; stroke-width: 3; }
      .badge-t { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
      .gpu { fill: #f2fbe6; stroke: #76b900; stroke-width: 1.2; }
      .gpu-t { font-size: 12px; font-weight: 600; fill: #3f6212; }
      .gpu-m { font-size: 10px; fill: #4d7c0f; }
      .pill429 { fill: #fee2e2; stroke: #fca5a5; }
      .pill429-t { font-size: 11px; font-weight: 700; fill: #b91c1c; }
    </style>
