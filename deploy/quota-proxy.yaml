apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quota-ledger
  namespace: inference
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-proxy
  namespace: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quota-proxy
  template:
    metadata:
      labels:
        app: quota-proxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: quota-proxy
          image: quota-proxy:local
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: ledger, mountPath: /data}
            - {name: callers, mountPath: /config, readOnly: true}
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: quota-ledger
        - name: callers
          secret:
            secretName: callers
---
apiVersion: v1
kind: Service
metadata:
  name: quota-proxy
  namespace: inference
spec:
  selector:
    app: quota-proxy
  ports:
    - {name: http, port: 8080, targetPort: http}
